apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "student-api.fullname" . }}-test-connection"
  labels:
    {{- include "student-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args:
        - "-q"
        - "-O"
        - "-"
        - "http://student-api:5000/healthcheck"
  restartPolicy: Never